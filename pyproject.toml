[project]
name = "solarfil"
version = "0.1.0"
description = "Solar filament instance segmentation on GONG H-alpha (IEEE BigData Cup 2026)"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "pycocotools>=2.0.8",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "torch>=2.8",
    "torchvision>=0.23",
    "timm>=1.0.15",
    "segmentation-models-pytorch>=0.5",
    "matplotlib>=3.9",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]
notebook = [
    "jupyter>=1.1.1",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solarfil"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF100"]
ignore = ["B905"]  # zip() runs over sequences of equal length by construction

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pycocotools.*",
    "ignore::UserWarning:timm.*",
    "ignore::FutureWarning",
]
